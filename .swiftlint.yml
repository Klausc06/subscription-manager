only_rules:
  - closing_brace
  - colon
  - comma
  - control_statement
  - duplicate_imports
  - force_cast
  - force_try
  - legacy_constructor
  - redundant_string_enum_value
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - unused_closure_parameter
  - vertical_whitespace

excluded:
  # Paths are resolved relative to this file, so a bare `.build` misses the
  # nested SwiftPM scratch directories under Packages/*. Keep both spellings.
  - .build
  - "**/.build"
  - DerivedData
  - "**/DerivedData"
