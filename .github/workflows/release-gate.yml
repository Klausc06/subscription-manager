name: Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Xcode 27 release verification
    runs-on: xcode-27
    timeout-minutes: 75

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the supported Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s\n' \
            'GitHub xcode-27 is a public-preview runner; use a self-hosted Xcode 27 runner if the preview image is unavailable.' \
            | tee artifacts/runner-status.txt
          xcodebuild -version | tee artifacts/xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version | tee artifacts/iphoneos-sdk.txt
          xcrun simctl list devices available | tee artifacts/simulators.txt
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "${xcode_version%%.*}" -ge 27 ]]
          [[ "${ios_sdk%%.*}" -ge 27 ]]

      - name: Install the pinned project generator
        env:
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
          XCODEGEN_VERSION: 2.46.0
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}.zip"
          install_root="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          printf '%s  %s\n' "${XCODEGEN_SHA256}" "${archive}" \
            | shasum -a 256 --check
          unzip -q "${archive}" -d "${install_root}"
          xcodegen_bin="${install_root}/xcodegen/bin/xcodegen"
          printf '%s\n' "${install_root}/xcodegen/bin" >> "${GITHUB_PATH}"
          xcodegen_version="$("${xcodegen_bin}" --version)"
          printf '%s\n' "${xcodegen_version}" \
            | tee artifacts/xcodegen-version.txt
          [[ "${xcodegen_version}" == "Version: ${XCODEGEN_VERSION}" ]]

      - name: Verify repository-owned static inputs
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest Scripts.verify_repository_tests \
            2>&1 | tee artifacts/repository-verification-tests.log
          python3 Scripts/verify_repository.py \
            2>&1 | tee artifacts/repository-verification.log

      - name: Verify generated project is current
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml \
            2>&1 | tee artifacts/xcodegen.log
          set +e
          git diff --exit-code -- \
            SubscriptionManager.xcodeproj SubscriptionManager/Info.plist \
            > artifacts/xcodegen-diff.patch
          diff_status=$?
          set -e
          generated_status="$(git status --short --untracked-files=all -- \
            SubscriptionManager.xcodeproj SubscriptionManager/Info.plist)"
          printf '%s\n' "${generated_status}" \
            | tee artifacts/xcodegen-status.txt
          if [[ ${diff_status} -gt 1 ]]; then
            echo 'Could not inspect generated-project drift.' >&2
            exit "${diff_status}"
          fi
          if [[ ${diff_status} -ne 0 || -n "${generated_status}" ]]; then
            cat artifacts/xcodegen-diff.patch
            echo 'Generated project is not current.' >&2
            exit 1
          fi

      - name: Validate the bundled catalog
        shell: bash
        run: |
          set -euo pipefail
          swift run --package-path Packages/SubscriptionCore \
            -Xswiftc -warnings-as-errors CatalogValidator \
            SubscriptionManager/Resources/catalog-v1.json \
            2>&1 | tee artifacts/catalog-validator.log

      - name: Test SubscriptionCore with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/SubscriptionCore \
            -Xswiftc -warnings-as-errors \
            2>&1 | tee artifacts/subscription-core-tests.log

      - name: Test the macOS application module
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project SubscriptionManager.xcodeproj \
            -scheme SubscriptionManager \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ci-macos-tests \
            -resultBundlePath artifacts/macos-tests.xcresult \
            -only-testing:SubscriptionManagerTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee artifacts/macos-tests.log

      - name: Test the iOS application module
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project SubscriptionManager.xcodeproj \
            -scheme SubscriptionManager \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath .build/ci-ios-unit-tests \
            -resultBundlePath artifacts/ios-unit-tests.xcresult \
            -only-testing:SubscriptionManagerTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee artifacts/ios-unit-tests.log

      - name: Run the existing iOS UI acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project SubscriptionManager.xcodeproj \
            -scheme SubscriptionManager \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath .build/ci-ios-ui-tests \
            -resultBundlePath artifacts/ios-ui-tests.xcresult \
            -only-testing:SubscriptionManagerUITests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee artifacts/ios-ui-tests.log

      - name: Run the iPad-only adaptive layout contract
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project SubscriptionManager.xcodeproj \
            -scheme SubscriptionManager \
            -destination 'platform=iOS Simulator,name=iPad Air 11-inch (M4),OS=latest' \
            -derivedDataPath .build/ci-ipad-ui-tests \
            -resultBundlePath artifacts/ipad-ui-tests.xcresult \
            -only-testing:SubscriptionManagerUITests/SubscriptionManagerUITests/testWideIPadUsesSidebarToSwitchDestinations \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee artifacts/ipad-ui-tests.log

      - name: Build release products for macOS and iOS
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project SubscriptionManager.xcodeproj \
            -scheme SubscriptionManager \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/ci-macos-release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee artifacts/macos-release.log
          xcodebuild build \
            -project SubscriptionManager.xcodeproj \
            -scheme SubscriptionManager \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ci-ios-release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee artifacts/ios-release.log

      - name: Reject repository build warnings and duplicate runtime definitions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          logs=(artifacts/*.log)
          if (( ${#logs[@]} == 0 )); then
            echo 'No release logs were produced.' >&2
            exit 1
          fi
          set +e
          grep -n -i -E '(^|[[:space:]])warning:' "${logs[@]}"
          warning_status=$?
          set -e
          case "${warning_status}" in
            0)
              echo 'Release-owned build warnings are not allowed.' >&2
              exit 1
              ;;
            1)
              ;;
            *)
              echo 'Could not scan release logs for warnings.' >&2
              exit "${warning_status}"
              ;;
          esac
          set +e
          grep -n -E \
            'Class (_TtC16SubscriptionCore21SubscriptionWorkspace|_TtC16SubscriptionCore19WidgetSnapshotStore) is implemented in both' \
            "${logs[@]}"
          duplicate_class_status=$?
          set -e
          case "${duplicate_class_status}" in
            0)
              echo 'SubscriptionCore runtime definitions must be loaded exactly once.' >&2
              exit 1
              ;;
            1)
              ;;
            *)
              echo 'Could not scan release logs for duplicate runtime definitions.' >&2
              exit "${duplicate_class_status}"
              ;;
          esac

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7
