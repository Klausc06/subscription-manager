name: SubscriptionManager

options:
  bundleIdPrefix: com.klausc06
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  localPackagesGroup: Packages

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    ENABLE_PREVIEWS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    MARKETING_VERSION: 0.1.0
    SWIFT_EMIT_LOC_STRINGS: true
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

packages:
  SubscriptionCore:
    path: Packages/SubscriptionCore

targets:
  SubscriptionManager:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: SubscriptionManager
        optional: true
    dependencies:
      - package: SubscriptionCore
      - target: SubscriptionManagerWidget
        embed: true
        platformFilter: iOS
    info:
      path: SubscriptionManager/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        NSCalendarsFullAccessUsageDescription: Subscription Manager uses full Calendar access only after you choose Import to Calendar, so it can keep your dedicated renewal calendar free of duplicate events.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - subscription-manager
    settings:
      base:
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": SubscriptionManager/SubscriptionManager.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": SubscriptionManager/SubscriptionManager.entitlements
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "DEVELOPMENT_TEAM[sdk=macosx*]": ""
        APP_GROUP_IDENTIFIER: group.com.klausc06.SubscriptionManager
        PRODUCT_BUNDLE_IDENTIFIER: com.klausc06.SubscriptionManager
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"

  SubscriptionManagerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SubscriptionManagerWidget
    dependencies:
      - package: SubscriptionCore
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: SubscriptionManagerWidget/SubscriptionManagerWidget.entitlements
        APP_GROUP_IDENTIFIER: group.com.klausc06.SubscriptionManager
        INFOPLIST_FILE: SubscriptionManagerWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.klausc06.SubscriptionManager.Widget
        TARGETED_DEVICE_FAMILY: "1,2"

  SubscriptionManagerTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: SubscriptionManagerTests
    dependencies:
      - target: SubscriptionManager
    settings:
      base:
        "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "DEVELOPMENT_TEAM[sdk=macosx*]": ""
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.klausc06.SubscriptionManagerTests
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/SubscriptionManager.app/Contents/MacOS/SubscriptionManager"

  SubscriptionManagerUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations:
      - iOS
    sources:
      - path: SubscriptionManagerUITests
    dependencies:
      - target: SubscriptionManager
    settings:
      base:
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "DEVELOPMENT_TEAM[sdk=macosx*]": ""
        GENERATE_INFOPLIST_FILE: true
        LM_SKIP_METADATA_EXTRACTION: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.klausc06.SubscriptionManagerUITests

schemes:
  SubscriptionManager:
    build:
      targets:
        SubscriptionManager: all
        SubscriptionManagerTests:
          - test
        SubscriptionManagerUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: SubscriptionManagerTests
        - name: SubscriptionManagerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
